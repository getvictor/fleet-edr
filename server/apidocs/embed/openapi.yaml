openapi: 3.1.0
info:
  title: Fleet EDR API
  version: "0.2.0"
  description: |
    HTTP API for Fleet EDR. Three audience tiers:

    - **Agents** (macOS endpoints) authenticate with a per-host bearer
      token obtained at enrollment. They call `POST /api/enroll`,
      `POST /api/events`, and the host-scoped `GET /api/commands` and
      `PUT /api/commands/{id}` endpoints.
    - **Browsers** (admin UI) authenticate with an `edr_session` cookie
      (HttpOnly, Secure, SameSite=Lax) plus an `X-CSRF-Token` header on
      unsafe methods. They call the session-protected endpoints.
    - **Operators** hit `/livez`, `/readyz`, `/health` with no auth.

    For prose context see
    [docs/api.md](https://github.com/getvictor/fleet-edr/blob/main/docs/api.md).
    For a human-readable host/agent install guide see
    [docs/install-agent-manual.md](https://github.com/getvictor/fleet-edr/blob/main/docs/install-agent-manual.md).
  license:
    name: Fleet EDR License
    url: https://github.com/getvictor/fleet-edr/blob/main/LICENSE
servers:
  - url: https://edr.example.com
    description: Your EDR server
tags:
  - name: Health
    description: Liveness / readiness probes (no auth)
  - name: Agent
    description: Endpoints called by the macOS agent
  - name: Session
    description: Browser login / logout
  - name: Hosts
    description: Host + process graph (UI)
  - name: Alerts
    description: Detection alerts (UI)
  - name: Commands
    description: Command queue (UI + Agent)
  - name: Admin
    description: Enrollment + policy management (UI, admin-only)
  - name: Rule authoring
    description: |
      The rule documents a deployment loads, as opposed to the per-rule
      tuning under Detection tuning. Read is held by admin and
      senior_analyst; changing content is held by admin.
  - name: Detection tuning
    description: |
      Detection-rule tuning the engine consults at evaluation time:
      per-host false-positive exclusions and per-rule
      mode/severity. Reads require `detection_config.read` (admin +
      senior analyst); writes require `detection_config.write` (admin).
      Every mutation records an audit row carrying the actor + reason.

paths:
  /livez:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Returns 200 as long as the process is up. Does not touch the DB.
      security: []
      responses:
        "200":
          description: Process alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      description: |
        Returns 200 only when the server is ready to handle traffic. Fails
        with 503 if the DB is unreachable. Use this behind a load balancer.
      security: []
      responses:
        "200":
          description: Server ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Server not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /health:
    get:
      tags: [Health]
      summary: Alias for /readyz
      description: Retained for human convenience and existing monitors.
      security: []
      responses:
        "200":
          description: Server ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Server not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /api/enroll:
    post:
      tags: [Agent]
      summary: Enroll a new host
      description: |
        Exchanges the shared enroll secret + hardware fingerprint for a
        per-host bearer token. Re-enrollment of an existing hardware UUID
        returns the existing token and bumps `enrolled_at`.

        Rate-limited per-IP at `EDR_ENROLL_RATE_PER_MIN` (default 30).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
      responses:
        "200":
          description: Enrolled or re-enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollResponse"
        "400":
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong enroll secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Enrollment revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema: {type: integer}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/events:
    post:
      tags: [Agent]
      summary: Ingest a batch of endpoint security events
      description: |
        Agents POST a JSON array of event envelopes. Each event's
        `host_id` must match the token's authenticated host_id;
        mismatches reject the whole batch. The body is capped at 10 MB.
        The server returns the count of events persisted.
      security:
        - HostToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/EventEnvelope"
      responses:
        "200":
          description: Events persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "400":
          description: Invalid JSON, missing required fields, or host_id mismatch
        "401":
          description: Missing or invalid host token

  /api/session:
    get:
      tags: [Session]
      summary: Get the current session
      description: |
        Returns the authenticated user + per-session CSRF token. The
        session cookie itself is minted upstream by the OIDC callback
        (`GET /api/auth/callback`) or the break-glass FinishLogin /
        FinishSetup endpoints; there is no password-based
        `POST /api/session`.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Not logged in
    delete:
      tags: [Session]
      summary: Log out
      description: Clears the session row and expires the cookie.
      security:
        - SessionCookie: []
          CSRF: []
      responses:
        "204":
          description: Logged out

  /api/hosts:
    get:
      tags: [Hosts]
      summary: List hosts
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Host summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HostSummary"

  /api/hosts/{host_id}/tree:
    get:
      tags: [Hosts]
      summary: Process tree for a host
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/HostID"
        - name: from
          in: query
          schema: {type: integer, format: int64}
          description: Lower bound, ns since epoch. Default `now - 1h`.
        - name: to
          in: query
          schema: {type: integer, format: int64}
          description: Upper bound, ns since epoch. Default `now`.
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 5000, default: 2000}
        - name: flatten
          in: query
          description: >-
            When true, opt out of sibling aggregation and return the raw forest with every node. By default the response
            collapses repeated identical-path leaf siblings under the same parent into aggregated `×N` nodes (issue #416).
          schema: {type: boolean, default: false}
        - name: pin
          in: query
          description: >-
            Process id to keep as a first-class node: the named process is never folded into a sibling `×N` aggregate, so a
            client such as the alert view can locate the alerted process by its real id even when it has identical siblings.
            0 (the default) pins nothing.
          schema: {type: integer, format: int64, default: 0}
      responses:
        "200":
          description: Forest of process roots
          content:
            application/json:
              schema:
                type: object
                properties:
                  roots:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProcessNode"

  /api/hosts/{host_id}/processes/{pid}:
    get:
      tags: [Hosts]
      summary: Process detail
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/HostID"
        - name: pid
          in: path
          required: true
          schema: {type: integer}
        - name: at
          in: query
          schema: {type: integer, format: int64}
          description: Point-in-time ns since epoch. Default `now`.
      responses:
        "200":
          description: Process detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"
        "404":
          description: No process found at the given coordinates

  /api/alerts:
    get:
      tags: [Alerts]
      summary: List alerts
      security:
        - SessionCookie: []
      parameters:
        - name: host_id
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema:
            type: string
            enum: [open, acknowledged, resolved]
        - name: severity
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: source
          in: query
          description: |
            Restrict to alerts emitted by a specific subsystem. Default is no
            filter (returns all sources). Catalog rules produce "detection";
            application_control_block events produce "application_control".
          schema:
            type: string
            enum: [detection, application_control]
        - name: process_id
          in: query
          schema: {type: integer, format: int64}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, default: 100}
      responses:
        "200":
          description: Alert list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /api/alerts/{id}:
    get:
      tags: [Alerts]
      summary: Alert detail (with event IDs)
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200":
          description: Alert with linked events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertDetail"
        "404":
          description: Alert not found
    put:
      tags: [Alerts]
      summary: Update alert status
      security:
        - SessionCookie: []
          CSRF: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, acknowledged, resolved]
      responses:
        "204":
          description: Status updated
        "400":
          description: Invalid status value
        "404":
          description: Alert not found

  /api/commands:
    get:
      tags: [Commands]
      summary: List commands for the authenticated host
      description: |
        Host-token-only. The `host_id` is always the authenticated host's
        id; any query parameter is ignored. Polling this endpoint also
        refreshes the host's `last_seen` timestamp.
      security:
        - HostToken: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, acked, completed, failed]
      responses:
        "200":
          description: Command list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Command"
    post:
      tags: [Commands]
      summary: Enqueue a command for a host (admin)
      security:
        - SessionCookie: []
          CSRF: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host_id, command_type]
              properties:
                host_id: {type: string}
                command_type: {type: string}
                payload: {type: object, additionalProperties: true}
      responses:
        "201":
          description: Command created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer, format: int64}

  /api/commands/{id}:
    get:
      tags: [Commands]
      summary: Get a single command (admin)
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200":
          description: Command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Command"
        "404":
          description: Not found
    put:
      tags: [Commands]
      summary: Update command status (agent)
      description: |
        Agents call this with `status=acked` once they pick up a command
        and with `status=completed` or `status=failed` once they finish.
        The handler enforces that the command belongs to the authenticated
        host - agent A cannot touch agent B's commands.
      security:
        - HostToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [acked, completed, failed]
                result:
                  type: object
                  description: Command-type-specific result blob, free-form JSON
      responses:
        "204":
          description: Status updated
        "400":
          description: Invalid status
        "404":
          description: Command not found (or not owned by authenticated host)

  /api/enrollments:
    get:
      tags: [Admin]
      summary: List enrollments
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Enrollment rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enrollment"

  /api/enrollments/{host_id}/revoke:
    post:
      tags: [Admin]
      summary: Revoke a host enrollment
      description: |
        After revocation the host's token stops working on all
        host-token endpoints. A revoked host cannot re-enroll without
        admin approval (reusing the same hardware UUID still returns
        403).
      security:
        - SessionCookie: []
          CSRF: []
      parameters:
        - $ref: "#/components/parameters/HostID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string}
                actor: {type: string}
      responses:
        "204":
          description: Revoked
        "404":
          description: Host not found

  /api/policy:
    get:
      tags: [Admin]
      summary: Current blocklist policy
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Current policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
    put:
      tags: [Admin]
      summary: Replace blocklist policy
      description: |
        Replaces the entire policy atomically and fans out a
        `policy.update` command to every active host. The response
        reports how many hosts received the fan-out; failed hosts will
        pick it up on their next poll.
      security:
        - SessionCookie: []
          CSRF: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paths:
                  type: array
                  items: {type: string}
                hashes:
                  type: array
                  items: {type: string}
                reason: {type: string}
                actor: {type: string}
      responses:
        "200":
          description: Policy updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyUpdateResult"

  /api/attack-coverage:
    get:
      tags: [Admin]
      summary: MITRE ATT&CK coverage (Navigator layer)
      description: |
        Returns a MITRE ATT&CK Navigator layer document enumerating the
        techniques covered by currently-registered detection rules. Drop
        the response directly into
        https://mitre-attack.github.io/attack-navigator/ to visualise
        coverage as a heatmap. Output is deterministic (sorted technique
        IDs + sorted, dedup'd rule ID lists), so responses are
        byte-identical across requests and safe to ETag.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Navigator layer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigatorLayer"

  /api/rules:
    get:
      tags: [Admin]
      summary: Detection rule documentation
      description: |
        Returns the structured per-rule documentation for every registered
        detection rule, in the engine's registration order. The same data
        feeds the UI's `/ui/rules/<id>` rule-detail page and the
        deterministic markdown reference at `docs/detection-rules.md`
        (generated by `tools/gen-rule-docs`).
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Per-rule documentation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesResponse"

  /api/rules/{id}/export:
    get:
      tags: [Admin]
      summary: Export a detection rule as a declarative rule file
      description: |
        Returns one registered detection rendered as a declarative rule file:
        standard Sigma metadata plus a namespaced `x-engine` key carrying our
        rule id, kind, portability, event types, the evaluator that decides
        the rule, the exclusion dimensions it honours, and its known
        limitations.

        The response body IS the artifact rather than a description of one, so
        it is served as YAML. It is the same document as the corresponding
        file in the rule pack at `server/rules/internal/catalog/pack/`,
        without that file's generated-file header.

        Only detections are exportable. A registered rule that is not a
        detection (a projection of a decision the agent already made, or a
        health signal about the agent itself) returns 404, the same answer as
        a rule id that names nothing.
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: The rule's stable snake_case identifier, as returned by `GET /api/rules`.
          schema:
            type: string
      responses:
        "200":
          description: The rule file
          content:
            application/yaml:
              schema:
                type: string
        "401":
          description: No authenticated session
        "404":
          description: No such detection, or the rule is not a detection
        "500":
          description: The rule could not be rendered

  /api/v1/detection-config/exclusions:
    get:
      tags: [Detection tuning]
      summary: List detection exclusions
      description: |
        Returns every configured false-positive exclusion the detection
        engine consults at evaluation time. A `host_group_id` of 0 is a
        global exclusion (the only scope the Phase A surface accepts).
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Exclusion list
          content:
            application/json:
              schema:
                type: object
                required: [exclusions]
                properties:
                  exclusions:
                    # The key is always present, but the server marshals an empty Go slice as JSON null, so the array is nullable.
                    type: [array, "null"]
                    items:
                      $ref: "#/components/schemas/DetectionExclusion"
        "403":
          description: Caller lacks detection_config.read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionConfigError"
    post:
      tags: [Detection tuning]
      summary: Create a detection exclusion
      description: |
        Adds a false-positive exclusion for a rule. `reason` is required
        and recorded on the audit row. Group-scoped entries are rejected
        for now (use the global scope, `host_group_id` 0); the snapshot
        reloads on this replica so the exclusion takes effect without a
        restart.
      security:
        - SessionCookie: []
          CSRF: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDetectionExclusionRequest"
      responses:
        "201":
          description: Exclusion created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionExclusion"
        "400":
          description: |
            Invalid input: malformed JSON, a blank `reason`, an
            unsupported `match_type`, or a non-global `host_group_id`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionConfigError"
        "403":
          description: Caller lacks detection_config.write
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionConfigError"

  /api/v1/detection-config/exclusions/{id}:
    delete:
      tags: [Detection tuning]
      summary: Delete a detection exclusion
      description: |
        Removes an exclusion by id. The audit `reason` rides a query
        parameter because the DELETE carries no body; it is required.
      security:
        - SessionCookie: []
          CSRF: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - name: reason
          in: query
          required: true
          description: Audit reason recorded on the deletion event.
          schema: {type: string}
      responses:
        "204":
          description: Exclusion deleted
        "400":
          description: Invalid id, or a blank `reason`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionConfigError"
        "403":
          description: Caller lacks detection_config.write
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionConfigError"
        "404":
          description: No exclusion with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionConfigError"

  /api/v1/detection-config/rule-settings:
    get:
      tags: [Detection tuning]
      summary: List per-rule settings
      description: |
        Returns the per-(rule, scope) mode + optional severity override.
        A rule with no row defaults to `alert` at its declared severity.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Rule-setting list
          content:
            application/json:
              schema:
                type: object
                required: [rule_settings]
                properties:
                  rule_settings:
                    # The key is always present, but the server marshals an empty Go slice as JSON null, so the array is nullable.
                    type: [array, "null"]
                    items:
                      $ref: "#/components/schemas/DetectionRuleSetting"
        "403":
          description: Caller lacks detection_config.read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionConfigError"
    put:
      tags: [Detection tuning]
      summary: Upsert a per-rule setting
      description: |
        Sets the mode (`alert` / `monitor` / `disabled`) and optional
        severity override for a rule. The `(rule_id, host_group_id)` pair
        is the upsert key; `reason` is required and audited. A disabled
        rule stays registered (it keeps appearing in `GET /api/rules`)
        and simply emits nothing.
      security:
        - SessionCookie: []
          CSRF: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertDetectionRuleSettingRequest"
      responses:
        "200":
          description: Setting upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionRuleSetting"
        "400":
          description: |
            Invalid input: malformed JSON, a blank `reason`, an unknown
            `mode`, or a non-global `host_group_id`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionConfigError"
        "403":
          description: Caller lacks detection_config.write
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionConfigError"

  /api/v1/detection-config/rule-match-counts:
    get:
      tags: [Detection tuning]
      summary: List monitor-mode match counts per rule
      description: |
        Returns what each rule matched in monitor mode over a window: total
        matches, how many distinct hosts contributed, and when it last
        matched. This is the evidence for deciding whether to promote a rule
        from `monitor` to `alert`.

        A rule that matched nothing in the window is ABSENT rather than
        present with a zero, because absence and zero are different claims:
        a rule may have been promoted before the window opened.

        The figure is an APPROXIMATION of volume, not a forecast of alerts.
        It counts matches, while alerts deduplicate on
        `(host, rule, subject)` permanently, so it is biased upward by
        repeated subjects and downward by the recorder's documented losses.
      security:
        - SessionCookie: []
      parameters:
        - name: days
          in: query
          required: false
          description: |
            Window in whole days. Defaults to 7. Capped at the deployment's
            own counter retention (`EDR_RETENTION_DAYS`), and never more than
            30 days even where retention is longer or disabled, because the
            counters older than retention have already been pruned. The
            default is capped by the same bound. A request above the cap is
            served at the cap, and the `days` field in the response reports
            the window actually covered, which may be narrower than the one
            requested. `?days=` (supplied but empty) is rejected, like any
            other value that is not a positive whole number.
          schema:
            type: integer
            minimum: 1
            default: 7
      responses:
        "200":
          description: Per-rule match counts, most matches first
          content:
            application/json:
              schema:
                type: object
                required: [match_counts, days]
                properties:
                  match_counts:
                    type: array
                    items:
                      $ref: "#/components/schemas/RuleMatchCount"
                  days:
                    type: integer
                    description: The window actually covered, after the cap is applied.
                    example: 7
        "400":
          description: "`days` is not a positive whole number"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionConfigError"
        "403":
          description: Caller lacks detection_config.read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionConfigError"

  /api/v1/rule-content/documents:
    get:
      tags: [Rule authoring]
      summary: List the rule documents this deployment loads
      description: |
        Returns a summary of every document in the stored corpus, plus the
        corpus version a replica polls to notice a change.

        Summaries rather than content: the corpus is every rule the
        deployment runs, and returning all of it to draw a table of names
        would send megabytes. Fetch one document to read its content.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Corpus listing
          content:
            application/json:
              schema:
                type: object
                required: [corpus_version, documents]
                properties:
                  corpus_version:
                    type: integer
                    format: int64
                    description: |
                      Changes whenever the corpus changes. A write reports the
                      version it produced, so a caller can tell whether the
                      corpus it is looking at is still current.
                  documents:
                    type: array
                    items:
                      $ref: "#/components/schemas/RuleContentDocumentSummary"
        "403":
          description: Caller lacks rule_content.read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleContentError"

  /api/v1/rule-content/documents:check:
    post:
      tags: [Rule authoring]
      summary: Check a change without applying it
      description: |
        Reports what submitting a document would do. Nothing is stored and
        no mutation is audited, because nothing happened to the corpus.

        A refusal comes back as `200` with `would_apply: false`, NOT as a
        4xx. The check succeeded: a question was asked and correctly
        answered. A 4xx would say the request was wrong, which it was not,
        and would force a caller to treat "your rule has a problem" and
        "your request was malformed" through the same branch.

        Gated on `rule_content.read`, since it changes nothing.
      security:
        - SessionCookie: []
          CSRF: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: The path the document would be stored under.
                  example: authored/my_rule.yml
                content:
                  type: string
                  description: The rule file, verbatim.
      responses:
        "200":
          description: |
            The check completed. `would_apply` says whether submitting it
            would be accepted.
          content:
            application/json:
              schema:
                type: object
                required: [would_apply, warnings]
                properties:
                  would_apply:
                    type: boolean
                  warnings:
                    type: array
                    items:
                      type: string
                    description: |
                      Advisory. A rule this deployment cannot run is still a
                      rule an operator may store, so it is reported rather
                      than refused.
                  refusal:
                    type: string
                    description: Present only when `would_apply` is false.
        "400":
          description: Malformed JSON, an oversize body, or a missing `path`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleContentError"
        "403":
          description: Caller lacks rule_content.read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleContentError"

  /api/v1/rule-content/documents/{path}:
    parameters:
      - name: path
        in: path
        required: true
        description: |
          The document's path within the corpus, including directories, so
          it contains slashes (`authored/my_rule.yml`).
        schema:
          type: string
        example: authored/my_rule.yml
    get:
      tags: [Rule authoring]
      summary: Read one rule document
      description: |
        Returns the rule file itself rather than a JSON envelope, because
        the response IS the artifact an operator edits and hands to another
        tool. A caller who must unwrap it first is worse off.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: The rule file, verbatim.
          content:
            application/yaml:
              schema:
                type: string
        "403":
          description: |
            Caller lacks rule_content.read. Returned before the document is
            looked up, so the answer does not disclose whether it exists:
            existence is itself information about what a deployment detects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleContentError"
        "404":
          description: No such rule document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleContentError"
    put:
      tags: [Rule authoring]
      summary: Create or replace a rule document
      description: |
        Validates the corpus the write would produce, then stores the
        document if that corpus loads. `reason` is required and recorded on
        the audit row.

        Validation runs the same loader the deployment loads its corpus
        with, so acceptance means "this deployment will load this".
      security:
        - SessionCookie: []
          CSRF: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutRuleContentDocumentRequest"
      responses:
        "200":
          description: The document was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleContentChangeResult"
        "400":
          description: Malformed JSON, an oversize body, or a blank `reason`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleContentError"
        "403":
          description: Caller lacks rule_content.write
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleContentError"
        "409":
          description: |
            The corpus changed between being validated and being written.
            Re-read it and retry; the same change against the current
            corpus will usually succeed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleContentError"
        "413":
          description: Request body is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleContentError"
        "422":
          description: |
            The request was well formed and the CONTENT was not. The message
            carries the loader's own reason, naming what to fix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleContentError"
    delete:
      tags: [Rule authoring]
      summary: Delete a rule document
      description: |
        Removes the document, so the rule it defined stops being evaluated
        once replicas converge. `reason` is required and recorded.

        The corpus that would REMAIN is validated first: removing a rule can
        be the change that breaks a corpus, because what is left still has
        to load.
      security:
        - SessionCookie: []
          CSRF: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: Recorded on the audit row.
      responses:
        "200":
          description: The document was removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleContentChangeResult"
        "400":
          description: Malformed JSON or a blank `reason`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleContentError"
        "403":
          description: Caller lacks rule_content.write
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleContentError"
        "404":
          description: |
            No such rule document. Reported rather than treated as success,
            so an operator who mistyped a path learns they removed nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleContentError"
        "409":
          description: The corpus changed between validation and the write.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleContentError"
        "422":
          description: |
            The corpus that would remain does not load. The message carries
            the reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleContentError"

components:
  securitySchemes:
    HostToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Per-host bearer token issued by `POST /api/enroll`. Pass as
        `Authorization: Bearer <host_token>`.
    SessionCookie:
      type: apiKey
      in: cookie
      name: edr_session
      description: |
        HttpOnly cookie minted by the OIDC callback
        (`GET /api/auth/callback`) or the break-glass
        FinishLogin / FinishSetup endpoints. The browser attaches it
        automatically on subsequent requests.
    CSRF:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Required on unsafe methods (`POST`, `PUT`, `DELETE`) for
        session-cookie-authenticated endpoints. Value comes from
        `GET /api/session`'s `csrf_token` field.

  parameters:
    HostID:
      name: host_id
      in: path
      required: true
      description: Host identifier (UUID-shaped opaque string)
      schema: {type: string}

  schemas:
    LivenessResponse:
      type: object
      required: [status, uptime_seconds]
      properties:
        status: {type: string, enum: [ok]}
        version: {type: string}
        commit: {type: string}
        build_time: {type: string}
        uptime_seconds: {type: integer, format: int64}

    ReadinessResponse:
      type: object
      required: [status, uptime_seconds, checks]
      properties:
        status: {type: string, enum: [ok, degraded, draining]}
        version: {type: string}
        commit: {type: string}
        build_time: {type: string}
        uptime_seconds: {type: integer, format: int64}
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CheckResult"

    CheckResult:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok, error, unavailable, draining]}
        latency_ms: {type: integer, format: int64}
        error: {type: string}

    EnrollRequest:
      type: object
      required: [enroll_secret, hardware_uuid, hostname, os_version, agent_version]
      properties:
        enroll_secret: {type: string}
        hardware_uuid:
          type: string
          description: Apple hardware UUID; validated server-side against a UUID regex.
        hostname: {type: string}
        os_version: {type: string}
        agent_version: {type: string}

    EnrollResponse:
      type: object
      required: [host_id, host_token, enrolled_at]
      properties:
        host_id: {type: string}
        host_token:
          type: string
          description: Opaque bearer token. Store securely; do not log.
        enrolled_at: {type: string, format: date-time}

    SessionResponse:
      type: object
      required: [user, csrf_token]
      properties:
        user:
          type: object
          required: [id, email]
          properties:
            id: {type: integer, format: int64}
            email: {type: string, format: email}
        csrf_token: {type: string}

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: {type: string}

    EventEnvelope:
      type: object
      required: [event_id, host_id, timestamp_ns, event_type, payload]
      properties:
        event_id:
          type: string
          description: Opaque unique event identifier (the agent emits UUIDs; the server treats it as an opaque string).
        host_id: {type: string}
        timestamp_ns: {type: integer, format: int64}
        event_type:
          type: string
          enum: [exec, fork, exit, open, network_connect, dns_query, application_control_block, snapshot_heartbeat]
        payload:
          type: object
          description: Event-type-specific body; see schema/events.json in the repo

    IngestResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: integer
          description: Number of events successfully persisted.

    HostSummary:
      type: object
      properties:
        host_id: {type: string}
        event_count: {type: integer, format: int64}
        last_seen_ns: {type: integer, format: int64}

    Process:
      type: object
      properties:
        id: {type: integer, format: int64}
        host_id: {type: string}
        pid: {type: integer}
        ppid: {type: integer}
        path: {type: string}
        args: {type: array, items: {type: string}}
        uid: {type: integer}
        gid: {type: integer}
        code_signing:
          type: object
          properties:
            team_id: {type: string}
            signing_id: {type: string}
            flags: {type: integer}
            is_platform_binary: {type: boolean}
        sha256: {type: string}
        fork_time_ns: {type: integer, format: int64}
        exec_time_ns: {type: integer, format: int64}
        exit_time_ns: {type: integer, format: int64}
        exit_code: {type: integer}

    ProcessNode:
      allOf:
        - $ref: "#/components/schemas/Process"
        - type: object
          properties:
            children:
              type: array
              items:
                $ref: "#/components/schemas/ProcessNode"
            aggregated:
              $ref: "#/components/schemas/AggregatedSiblings"

    AggregatedSiblings:
      type: object
      description: >-
        Present when this node is a collapsed group of identical-path sibling processes rather than a single process
        (issue #416). The enclosing node then renders as a `×N` badge; its own process fields describe the earliest member
        (a representative), `children` is empty, and `sample` carries a capped, fork-ordered slice of the underlying
        members the UI can expand in place. Absent from a normal (non-aggregated) node.
      required: [count, exited_count, running_count, first_fork_ns, last_fork_ns]
      properties:
        count: {type: integer, description: Total members in the group.}
        exited_count: {type: integer, description: Members with an observed or synthesized exit.}
        running_count: {type: integer, description: Members still running (no exit).}
        first_fork_ns: {type: integer, format: int64, description: "Earliest fork time in the group, ns since epoch."}
        last_fork_ns: {type: integer, format: int64, description: "Latest fork time in the group, ns since epoch."}
        sample:
          type: array
          description: Capped, fork-ordered sample of the underlying members (never the whole group).
          items:
            $ref: "#/components/schemas/ProcessNode"

    Alert:
      type: object
      required: [id, host_id, rule_id, severity, title, origin, process_id, status, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        host_id: {type: string}
        rule_id: {type: string}
        severity: {type: string, enum: [low, medium, high, critical]}
        title: {type: string}
        description: {type: string}
        origin:
          type: string
          description: >-
            Who wrote the rule that fired, captured when the alert was raised. `Fleet EDR` for a rule this project authored,
            `SigmaHQ, by <author>` for one from the imported corpus. Distinct from `source`, which names the subsystem that
            raised the alert rather than the rule's author. Empty in two cases: an alert raised before the field existed, and an
            application-control block, whose rule id is the operator's own policy rather than a detection with an author.
          example: SigmaHQ, by Alejandro Ortuno, oscd.community
        process_id: {type: integer, format: int64}
        status: {type: string, enum: [open, acknowledged, resolved]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        resolved_at: {type: string, format: date-time}

    AlertDetail:
      allOf:
        - $ref: "#/components/schemas/Alert"
        - type: object
          properties:
            event_ids:
              type: array
              items: {type: string, format: uuid}
            events:
              type: array
              description: >-
                Self-contained evidence: the full envelopes of the alert's triggering events, captured at alert creation so the
                evidence survives event-store retention (ADR-0015). Best-effort; an event already aged out at creation time is
                omitted. event_ids remains the full correlated set.
              items:
                $ref: "#/components/schemas/EventEnvelope"

    Command:
      type: object
      required: [id, host_id, command_type, status, created_at]
      properties:
        id: {type: integer, format: int64}
        host_id: {type: string}
        command_type: {type: string}
        payload:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [queued, acked, completed, failed]
        created_at: {type: string, format: date-time}
        acked_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        result:
          type: object
          additionalProperties: true

    Enrollment:
      type: object
      properties:
        host_id: {type: string}
        hostname: {type: string}
        agent_version: {type: string}
        os_version: {type: string}
        source_ip: {type: string}
        enrolled_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        revoke_reason: {type: string}
        revoked_by: {type: string}

    Policy:
      type: object
      properties:
        version: {type: integer, format: int64}
        blocklist:
          type: object
          properties:
            paths:
              type: array
              items: {type: string}
            hashes:
              type: array
              items: {type: string}

    PolicyUpdateResult:
      type: object
      properties:
        version: {type: integer, format: int64}
        fanout_hosts: {type: integer}
        fanout_failed: {type: integer}

    NavigatorLayer:
      type: object
      description: MITRE ATT&CK Navigator 4.5 layer document.
      required: [name, versions, domain, filters, techniques]
      properties:
        name:
          type: string
          example: "Fleet EDR coverage"
        versions:
          type: object
          additionalProperties: {type: string}
          example:
            attack: "19"
            navigator: "5.2.0"
            layer: "4.5"
        domain:
          type: string
          example: "enterprise-attack"
        description: {type: string}
        filters:
          type: object
          description: >-
            Navigator layer filters. Scopes the rendered matrix to the platforms Fleet EDR supports;
            Fleet EDR is macOS-only, so the layer always carries `platforms: ["macOS"]`.
          required: [platforms]
          properties:
            platforms:
              type: array
              items: {type: string}
              example: ["macOS"]
        techniques:
          type: array
          items:
            type: object
            required: [techniqueID, score]
            properties:
              techniqueID:
                type: string
                example: "T1574.006"
              score:
                type: number
                description: |
                  1 when at least one rule covering this technique raises alerts. 0.5 when no rule
                  covering it raises an alert as shipped, whether because those rules record without
                  alerting or are off by default, so a coverage figure is not inflated by rules that
                  do not alert.
                example: 1
              # A fractional score is emitted for monitor-only coverage; clients must not assume an integer.

              color:
                type: string
                example: "#31a354"
              comment:
                type: string
                description: Human-readable note naming the rules that cover this technique.
                example: "Covered by: dyld_insert"

    RulesResponse:
      type: object
      description: |
        Wrapper returned by `GET /api/rules`. The `rules` array
        is in engine-registration order; clients should not assume any
        particular ordering beyond "stable across calls in the same
        process".
      required: [rules]
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/RuleDocEntry"

    RuleDocEntry:
      type: object
      required: [id, techniques, doc, default_mode, mode, mode_source, origin]
      properties:
        id:
          type: string
          description: Rule identifier (e.g. `credential_keychain_dump`). Stable across releases.
          example: credential_keychain_dump
        default_mode:
          type: string
          enum: [alert, monitor, disabled]
          description: |
            The mode this rule runs in when no per-rule setting applies to it. A rule this
            project wrote is `alert`; a rule imported from an upstream corpus starts at
            `monitor` so it records what it would have fired on without raising alerts, and
            imported rules outnumber ours. This is the rule's own default,
            not a resolved per-host mode: a setting created at
            `PUT /api/v1/detection-config/rule-settings` overrides it, and those settings are
            listed separately at `GET /api/v1/detection-config/rule-settings`.
          example: alert
        mode:
          type: string
          enum: [alert, monitor, disabled]
          description: |
            The mode the rule RUNS IN at global scope: the globally scoped setting when one
            applies, `default_mode` otherwise. This is the field that answers "what is this rule
            doing"; `default_mode` answers "what was it written to do". A rule an operator has
            disabled stays listed here with `mode` `disabled` rather than disappearing from the
            catalog. Global scope because this response names no host, and a per-host mode
            depends on one.
          example: monitor
        mode_source:
          type: string
          enum: [default, setting]
          description: |
            Which of the two produced `mode`: `setting` when an operator's globally scoped
            setting applies, `default` otherwise. Without it a reader cannot tell a rule that
            shipped in monitor from one an operator moved there, and those call for opposite
            follow-ups. A stored setting whose mode this server cannot interpret reports
            `default`, because the default is where the reported mode came from.
          example: default
        origin:
          type: string
          description: |
            Where the rule came from. `Fleet EDR` for a rule written for this engine; for a rule vendored from an
            upstream corpus, that project and the rule's own author, which is the attribution the corpus licence
            carries (those rules are shipped and exported unmodified). Always present on this endpoint, so a
            reader tells the two apart by the value rather than by its absence.
          example: "SigmaHQ, by Daniil Yugoslavskiy, oscd.community"
        techniques:
          type: array
          items:
            type: string
          description: MITRE ATT&CK technique IDs the rule covers.
          example: ["T1555.001"]
        doc:
          $ref: "#/components/schemas/RuleDoc"

    RuleDoc:
      type: object
      description: Operator-facing structured documentation for a single detection rule.
      required: [title, summary, description, severity, event_types]
      properties:
        title:
          type: string
          example: "Keychain credential dump"
        summary:
          type: string
          description: One-line elevator pitch shown in tooltips.
        description:
          type: string
          description: Long-form behavioural spec. Plain text; renderers split paragraphs on blank lines.
        severity:
          type: string
          enum: [low, medium, high, critical]
        event_types:
          type: array
          items:
            type: string
          description: Agent event types the rule consumes (e.g. `exec`, `open`).
          example: ["exec"]
        false_positives:
          type: array
          items:
            type: string
          description: Known-legitimate sources that can trigger the rule.
        limitations:
          type: array
          items:
            type: string
          description: Coverage gaps the rule does NOT catch.
        references:
          type: array
          items:
            type: string
          description: >-
            Sources the rule was written from. An imported rule carries the upstream rule's own citations.
          example: ["https://redcanary.com/blog/applescript/"]

    DetectionExclusion:
      type: object
      required: [id, rule_id, match_type, value, host_group_id, reason, enabled, created_by, created_at]
      properties:
        id: {type: integer, format: int64}
        rule_id:
          type: string
          description: Rule the exclusion applies to. An empty string is a shared exclusion that applies to every rule.
          example: suspicious_exec
        match_type:
          type: string
          enum: [path_glob, parent_path_glob, team_id, signing_id, cdhash, sha256, command_substring, domain]
        value:
          type: string
          example: "*/claude/versions/*"
        host_group_id:
          type: integer
          format: int64
          description: 0 is the global scope (the only scope the Phase A surface accepts).
          example: 0
        reason: {type: string, example: "Claude Code CLI"}
        enabled: {type: boolean}
        expires_at:
          type: string
          format: date-time
          description: Optional expiry; the resolver stops honouring the entry past this instant.
        created_by:
          type: string
          description: Actor identifier recorded at creation (e.g. `user:42`).
          example: "user:42"
        created_at: {type: string, format: date-time}

    DetectionRuleSetting:
      type: object
      required: [id, rule_id, host_group_id, mode, updated_by, updated_at]
      properties:
        id: {type: integer, format: int64}
        rule_id: {type: string, example: suspicious_exec}
        host_group_id:
          type: integer
          format: int64
          example: 0
        mode:
          type: string
          enum: [alert, monitor, disabled]
          description: |
            `alert` persists an alert (default); `monitor` evaluates the
            rule but emits an observability signal instead of an alert;
            `disabled` emits nothing (the rule stays registered).
        severity_override:
          type: string
          enum: [low, medium, high, critical]
          description: Overrides the rule's declared severity when set.
        settings:
          type: object
          additionalProperties: true
          description: Reserved for per-rule typed settings; absent until a rule declares a config schema.
        updated_by: {type: string, example: "user:42"}
        updated_at: {type: string, format: date-time}

    RuleMatchCount:
      type: object
      required: [rule_id, matches, hosts, last_seen]
      properties:
        rule_id: {type: string, example: proc_creation_macos_applescript}
        matches:
          type: integer
          format: int64
          description: |
            Total monitor-mode matches in the window. Approximate: it counts
            matches, not the alerts a promotion would raise.
          example: 90
        hosts:
          type: integer
          format: int64
          description: |
            Distinct hosts that contributed. The same total means opposite
            things at one host (an exclusion candidate) and at many (the rule
            is too broad).
          example: 3
        last_seen: {type: string, format: date-time}

    CreateDetectionExclusionRequest:
      type: object
      required: [rule_id, match_type, value, reason]
      properties:
        rule_id: {type: string, example: suspicious_exec}
        match_type:
          type: string
          enum: [path_glob, parent_path_glob, team_id, signing_id, cdhash, sha256, command_substring, domain]
        value: {type: string, example: "*/claude/versions/*"}
        reason:
          type: string
          description: Required; recorded on the audit row.
          example: "Claude Code CLI"
        host_group_id:
          type: integer
          format: int64
          default: 0
          description: Optional; defaults to 0 (global). A non-global scope is rejected with a 400 until editable host groups land.
        expires_at:
          type: string
          format: date-time
          description: Optional expiry.

    UpsertDetectionRuleSettingRequest:
      type: object
      required: [rule_id, mode, reason]
      properties:
        rule_id: {type: string, example: suspicious_exec}
        mode:
          type: string
          enum: [alert, monitor, disabled]
        reason:
          type: string
          description: Required; recorded on the audit row.
          example: "too noisy in the pilot fleet"
        severity_override:
          type: string
          enum: [low, medium, high, critical]
          description: Optional; clears the override when omitted.
        host_group_id:
          type: integer
          format: int64
          default: 0
          description: Optional; defaults to 0 (global). A non-global scope is rejected with a 400 until editable host groups land.

    RuleContentDocumentSummary:
      type: object
      required: [path, bytes]
      properties:
        path:
          type: string
          description: |
            The document's path within the corpus. The rule's IDENTITY is the
            file stem, so `authored/keychain_extra.yml` defines the rule
            `keychain_extra`, and renaming the file renames the rule.
          example: authored/keychain_extra.yml
        bytes:
          type: integer
          description: Size of the stored document.

    PutRuleContentDocumentRequest:
      type: object
      required: [content, reason]
      properties:
        content:
          type: string
          description: The rule file, verbatim.
        reason:
          type: string
          description: |
            Why the change is being made. Required, and recorded on the audit
            row: it is the only field that says why, so a blank one would
            leave a trail that records who and what and is silent on the
            question a reviewer is asking.

    RuleContentChangeResult:
      type: object
      required: [path, corpus_version, warnings]
      properties:
        path:
          type: string
        corpus_version:
          type: integer
          format: int64
          description: |
            The version the change produced. A replica has to reach this
            before the change is in force.
        warnings:
          type: array
          items:
            type: string
          description: |
            Advisory, and always an array so a caller need not null-check.
            A rule this deployment cannot run is still stored: the message
            says so, naming the file and the reason, rather than the change
            being refused.

    RuleContentError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable code the UI switches on.
          enum:
            - rule_content.invalid_json
            - rule_content.read_body
            - rule_content.body_too_large
            - rule_content.invalid_input
            - rule_content.refused
            - rule_content.not_found
            - rule_content.conflict
            - internal
        message:
          type: string
          description: |
            Human-readable detail. For a refusal this carries the loader's
            own reason, naming what to fix, rather than a rephrasing of it.

    DetectionConfigError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable code the UI switches on.
          enum:
            - detection_config.invalid_json
            - detection_config.read_body
            - detection_config.body_too_large
            - detection_config.invalid_input
            - detection_config.invalid_id
            - detection_config.not_found
            - internal
        message:
          type: string
          description: Human-readable detail.
          example: "reason is required"
