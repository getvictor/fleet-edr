title: Suspicious exec chain
id: 84a2309d-9c77-54c8-8b29-e7d484e890dd
status: stable
description: |-
  Flags a non-shell process that spawns a shell which, within 30 seconds, execs a binary from a world-writable directory.

  Detects the chain shape: non-shell parent → shell child → temp-directory exec (e.g. `/tmp/payload`).

  The rule fires on the LAST link of the chain (the temp exec) rather than the shell's exec. That makes it race-immune across the agent's flush boundaries: a chain that completes in ~150ms but straddles a 1-second flush boundary still resolves cleanly because the entire ancestor chain has already been ingested by the time the trigger event lands.

  The same chain making an outbound connection is `shell_network_connect`, which ships in monitor: a chain doing both raises one alert here and records a match there, and raises one alert per rule once that rule is promoted.

  30 seconds is the temporal cap between the shell exec and the temp exec.
author: Fleet EDR
level: high
tags:
  - attack.t1059.004
logsource:
  product: macos
  category: process_creation
falsepositives:
  - Interactive SSH where an admin runs a script from /tmp. Where that is routine on a server, a parent-path-glob exclusion for `/usr/libexec/sshd-session` silences it, but it also silences every command an attacker runs with a stolen SSH credential. Set an expiry on it and do not apply it to workstations.
  - Developer tooling that shells out (AI coding assistants, git hooks, IDEs). Exclude a Developer-ID signed tool by its `team_id` (Claude Code is `Q6L2SF6YDW`), which survives upgrades and cannot be claimed by a planted binary. For an unsigned tool use a parent-path-glob anchored to its full install path, never a leading `*`, with an expiry. Either way the exclusion trusts everything that parent can be made to run, so do not exclude a script interpreter.
  - Some Apple-signed installer-postflight scripts shell out to /tmp/ during package install.
x-engine:
  rule_id: suspicious_exec
  type: graph
  portable: none
  portability_note: The rule's logic is a Go implementation named by x-engine.algorithm, not a declarative detection block, so there is nothing here for another engine to evaluate. Rules whose logic can be expressed in Sigma are being converted separately; until a rule's logic lives in its file, this stays the honest answer.
  event_types:
    - exec
  algorithm: ancestor_walk_path_prefix
  params:
    # Maximum time between the shell exec and the trigger event (a temp-path exec or an outbound connect). Real chains complete
    # in seconds, so 30s is a generous ceiling rather than a tuned threshold.
    window: 30s
  exclusions:
    - parent_path_glob
    - team_id
    - signing_id
    - cdhash
  limitations:
    - The window bounds how long after the shell exec a temp exec still counts; long-tail post-shell activity is missed by design. Set in x-engine.params.window.
    - Exclusions are keyed by rule id, so one saved here does not silence `shell_network_connect` on the same parent, and vice versa.
    - 'A chain whose shell claims a parent that is not in the recorded process tree raises nothing, and is not reconsidered if that parent is recorded later. Skipped chains are counted per rule on the server''s detection traces. A shell started directly by launchd is a different case: it has no parent process row, but pid 1 is what its parent IS, so the alert names `/sbin/launchd` and a parent-path-glob exclusion for it works. Note that such an exclusion covers every launchd-started shell chain for this rule, which includes real persistence execution.'
