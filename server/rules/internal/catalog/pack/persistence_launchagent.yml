title: LaunchAgent persistence
id: ad26e192-079a-56f4-94ce-8aacef94143d
status: stable
description: |-
  Flags `launchctl load` / `launchctl bootstrap` of a plist under ~/Library/LaunchAgents or /Library/LaunchAgents.

  Detects the canonical user-domain persistence step on macOS: an attacker drops a plist into a LaunchAgents directory and then activates it via `launchctl load <plist>` or `launchctl bootstrap gui/<uid> <plist>`. We catch the activation rather than the file write so the alert ties to the moment the persistence becomes effective.

  Argument parsing handles launch-domain specifiers (`gui/501`) preceding the plist path and tolerates flag-like args between `load` and the plist (`-w`, `-F`, etc.).
author: Fleet EDR
level: high
tags:
  - attack.t1543.001
logsource:
  product: macos
  category: process_creation
detection:
  # The launchctl binaries whose invocation this rule is about. Matched with |re rather than a plain value or a list because a
  # plain Sigma value folds case, while the Go rule this replaces compared against an exact set.
  selection_binary:
    Image|re: '^(/bin/launchctl|/usr/bin/launchctl)$'
  # The subcommands that actually register a job. `launchctl list` or `print` naming a plist path is not persistence, which is why
  # this matches the verb rather than the command line: Subcommand is the first non-flag token after argv[0], so the plist path
  # cannot be mistaken for it and a later mention of `load` cannot stand in for one.
  selection_subcommand:
    Subcommand|re: '^(load|bootstrap)$'
  # The target must be a LaunchAgent plist, and it must be an ARGUMENT rather than anywhere in the command line.
  # CommandArguments holds the operands after the subcommand, and Sigma matches a list-valued field when any element does, which is
  # exactly the question the rule asks. Case-insensitive here deliberately: the path is a filesystem path on a case-insensitive
  # volume, and the Go regexp this replaces carried (?i) for the same reason.
  selection_target:
    CommandArguments|re: '(?i)(^|/)(Users/[^/]+/)?Library/LaunchAgents/[^/]+\.plist$'
  condition: selection_binary and selection_subcommand and selection_target
falsepositives:
  - MDM- or installer-provisioned LaunchAgents (Munki, Kandji, JumpCloud) loaded at deploy time. Add a path-glob exclusion for their plist paths via the detection-config surface.
  - Developer tools that register helper agents (Docker Desktop, Backblaze, etc.) on first launch.
x-engine:
  rule_id: persistence_launchagent
  type: sigma
  portable: mapped
  portability_note: The rule's logic is the detection block in this file. It is valid Sigma, but it reads the fields CommandArguments and Subcommand, which this engine computes rather than taking from Sigma's own taxonomy, so another engine needs them supplied to evaluate the rule. Sigma has no equivalent because it represents a command line as a single string, in which argument position is no longer recoverable.
  event_types:
    - exec
  exclusions:
    - path_glob
  limitations:
    - 'Does not cover `launchctl bootout` or `launchctl unload`: those undo persistence rather than create it.'
    - Does not catch direct plist writes that never get activated; pair with the privilege_launchd_plist_write rule for system-domain coverage.
