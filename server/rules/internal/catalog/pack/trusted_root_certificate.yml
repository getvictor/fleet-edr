title: Certificate trusted from the command line
id: 96b84b1b-2d2a-5c6e-9e65-8e8ca76556a5
status: stable
description: |-
  Flags `security add-trusted-cert` or `security trust-settings-import`, which make macOS trust a certificate.

  Detects a root certificate being installed on macOS (T1553.004). A certificate the host trusts as a root lets whoever holds its key intercept the host's TLS connections, or sign code the host will accept.

  Fires on an invocation of `/usr/bin/security` whose subcommand is `add-trusted-cert` or `trust-settings-import`, both of which write trust settings. `add-certificates`, which adds a certificate without trusting it, is left out, as are a `-h`, which prints help, a result type of `deny` or `unspecified`, which records a certificate as not trusted, and `-o`, which writes the trust settings to a file instead of the host.
author: Fleet EDR
level: high
tags:
  - attack.t1553.004
logsource:
  product: macos
  category: process_creation
detection:
  # The binary that writes trust settings from the command line. |re so the match is exact: a plain Sigma value folds case.
  selection_binary:
    Image|re: '^/usr/bin/security$'
  # The subcommands that write trust settings. Subcommand is the first non-flag token after argv[0] (sigmabind/argv.go), so
  # `security help add-trusted-cert` does not match. add-certificates adds a certificate without trusting it, and is left out.
  selection_subcommand:
    Subcommand|re: '^(?:add-trusted-cert|trust-settings-import)$'
  # A -h anywhere asks for help and changes nothing: among security's global flags it prints the subcommand's help, and after
  # add-trusted-cert it is that handler's usage request (Apple's trusted_cert_add.c). Subcommand skips leading flags, so both
  # help forms yield the same subcommand as a real invocation.
  filter_help:
    CommandLine|re: '\s-h(?:\s|$)'
  # A result type of deny or unspecified records a certificate as NOT trusted, the opposite of what this rule reports. The default
  # (trustRoot for a self-signed certificate, trustAsRoot otherwise) and an explicit trustRoot or trustAsRoot are what trust it.
  filter_distrust:
    CommandLine|re: '\s-r\s*(?:deny|unspecified)(?:\s|$)'
  # add-trusted-cert -o <file> writes the resulting trust settings to that file instead of applying them to the host.
  filter_settings_file:
    CommandLine|re: '\s-o(?:\s|$)'
  condition: selection_binary and selection_subcommand and not filter_help and not filter_distrust and not filter_settings_file
falsepositives:
  - An administrator or an IT script deploying an internal root by hand. Prefer a configuration profile pushed by MDM, which is not reported; where a script is how it is done, set this rule to monitor on the hosts it runs on.
x-engine:
  rule_id: trusted_root_certificate
  type: sigma
  portable: mapped
  portability_note: The rule's logic is the detection block in this file. It is valid Sigma, but it reads the field Subcommand, which this engine computes rather than taking from Sigma's own taxonomy, so another engine needs it supplied to evaluate the rule. Sigma has no equivalent because it represents a command line as a single string, in which argument position is no longer recoverable.
  event_types:
    - exec
  limitations:
    - A trust setting written through the Security framework by a program of its own runs no `security` exec and is not reported.
    - A certificate installed by a configuration profile is not reported, whoever pushed the profile.
