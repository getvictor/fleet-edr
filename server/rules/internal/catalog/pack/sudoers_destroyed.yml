title: Sudoers policy destroyed
id: 57564883-542b-5fd5-9c9d-b141ee16dd4d
status: stable
description: |-
  Flags a program that empties or deletes a sudoers file that sudo would have loaded.

  Detects destruction of sudo policy: a file sudo parses is truncated to nothing, or removed. Either takes away access that was granted, and either can be an attacker removing the evidence of a grant they added earlier.

  Emptying is detected however it is done. `truncate(2)` and a shell's `: > file` redirect are different kernel operations reaching the same outcome, and the redirect is the common one; before this rule existed it produced no telemetry at all.

  Only files sudo would actually load are considered: sudoers(5) skips names in /etc/sudoers.d that contain a `.` or end in `~`, and destroying a file sudo ignores destroys no policy. That also keeps `visudo` quiet, since it removes its own temporary file on every run.
author: Fleet EDR
level: high
tags:
  - attack.t1070.004
  - attack.t1531
logsource:
  product: macos
  category: file_delete
detection:
  # The same path test sudoers_tamper uses, and it has to be the same: sudoers(5) skips names in /etc/sudoers.d containing a
  # `.` or ending in `~`, so destroying one of those destroys no policy.
  #
  # The narrowing is load-bearing here rather than merely tidy. visudo UNLINKS its own `<name>.tmp` on every run, measured on
  # macOS 26.3, so a rule matching any direct child would report every legitimate sudoers edit as a policy deletion. That is
  # the same over-match that made sudoers_tamper fire on visudo (#933), reappearing through the deletion door.
  #
  # One condition covers both event types because both supply TargetFilename and both mean the same thing here: the policy
  # that was at this path is gone.
  selection:
    TargetFilename|re: '^(?:/private)?/etc/sudoers(?:\.d/[^/.]*[^/.~])?$'
  condition: selection
falsepositives:
  - A configuration manager that rewrites a fragment by deleting and recreating it rather than writing in place. Add a path-glob exclusion for its absolute path.
  - An administrator retiring a sudoers fragment by hand. This is a real administrative action and the rule cannot distinguish it from an attacker doing the same thing; the writer's identity is what separates them.
x-engine:
  rule_id: sudoers_destroyed
  type: sigma
  portable: mapped
  portability_note: The rule's logic is the detection block in this file and reads only fields from Sigma's own taxonomy, but it consumes event types spanning more than one Sigma category. Sigma allows one logsource category per rule, so this file declares file_delete and another engine would never route file_truncate events to it. Evaluating the rule as written therefore covers only part of what it detects here; the full set is in x-engine.event_types.
  event_types:
    - file_delete
    - file_truncate
  exclusions:
    - path_glob
  limitations:
    - 'Destruction of /etc/sudoers.d itself, rather than of a file within it, is not detected: the watched set is the files, not the directory.'
    - A file sudo already ignores (a name containing a `.` or ending in `~`) is deliberately not reported, so an attacker removing their own `.tmp` staging file leaves no finding from this rule.
