title: SSH authorized keys changed
id: 8f30dbed-fe12-5306-be52-a5fde3f3f021
status: stable
description: |-
  Flags a write to, or a rename onto, a user's SSH authorized_keys file.

  Detects SSH key persistence on macOS (T1098.004): a public key added to `~/.ssh/authorized_keys` (or `authorized_keys2`) lets whoever holds the private key log in as that user, and keeps working after the user's password changes. Every home is watched, root's included.

  The rule reads renames as well as writes, so a key file prepared elsewhere and moved into place is caught. It does not filter on Apple-signed tools, because keys are added with `cat`, `tee` and `ssh-copy-id`'s remote shell.
author: Fleet EDR
level: medium
tags:
  - attack.t1098.004
logsource:
  product: macos
  category: file_event
detection:
  # A file sshd reads authorized public keys from being changed, in any home. The adapter supplies TargetFilename only for an event
  # that carries write access, and for a `file_rename` it is the DESTINATION, so this one condition asks both event types whether
  # a key file was just written. `authorized_keys2` is the second name sshd's default AuthorizedKeysFile still reads.
  selection:
    TargetFilename|endswith:
      - /.ssh/authorized_keys
      - /.ssh/authorized_keys2
  condition: selection
falsepositives:
  - A person adding their own key, by hand or with `ssh-copy-id` from another machine. Confirm with them; the writer is their shell or editor.
  - Configuration management that distributes keys (Ansible, Chef, Puppet, an MDM script). Add a path-glob exclusion for the agent's absolute path.
x-engine:
  rule_id: persistence_ssh_authorized_keys
  type: sigma
  portable: mapped
  portability_note: The rule's logic is the detection block in this file and reads only fields from Sigma's own taxonomy, but it consumes event types spanning more than one Sigma category. Sigma allows one logsource category per rule, so this file declares file_event and another engine would never route file_rename events to it. Evaluating the rule as written therefore covers only part of what it detects here; the full set is in x-engine.event_types.
  event_types:
    - open
    - file_rename
  exclusions:
    - path_glob
  limitations:
    - 'A key file sshd_config names with a custom `AuthorizedKeysFile` is not detected: the rule matches only the default `authorized_keys` and `authorized_keys2` names, and watching another name only records its writes.'
    - 'Removing a key, or deleting the file, is not reported: removal takes access away rather than granting it.'
