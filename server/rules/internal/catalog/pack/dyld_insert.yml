title: DYLD injection on exec
id: a531f8d1-c355-5aba-99ea-6b3e22697c18
status: stable
description: |-
  Flags exec where DYLD_INSERT_LIBRARIES or DYLD_LIBRARY_PATH is set in argv (shell-style or via env(1)).

  Detects the classic macOS code-injection primitive: launching a process with `DYLD_INSERT_LIBRARIES=…` or `DYLD_LIBRARY_PATH=…` set so dyld loads attacker-supplied dylibs into the new process before main(). The rule fires on the leading argv slot only (the `VAR=value /path/to/bin` shell form, or the `env VAR=value /path/to/bin` invocation), so substring noise (curl POST data, echo, etc.) does not false-positive.

  The matching dylib path is redacted in alert text (a sensitive payload location) but kept in the raw event payload for responders.
author: Fleet EDR
level: high
tags:
  - attack.t1574.006
logsource:
  product: macos
  category: process_creation
detection:
  # EnvAssignments holds only the leading KEY=VALUE window: argv[0] for an ordinary binary, and the run of leading assignments for
  # an `env`-style invocation. That is the whole point of the field. `DYLD_INSERT_LIBRARIES=x /bin/true` and
  # `/bin/true DYLD_INSERT_LIBRARIES=x` carry the same text and only the first is an injection, and a CommandLine substring match
  # cannot tell them apart because a substring match is precisely what discards position.
  #
  # Matched with |re rather than |startswith because |startswith folds case, while the Go rule this replaces used
  # strings.HasPrefix: a lowercased `dyld_insert_libraries=` would otherwise have started firing.
  #
  # No binary condition, deliberately: the rule has never had one. The executable path decides only whether the leading window is
  # argv[0] alone or a run of `env` assignments, and that decision lives in the field rather than here.
  selection:
    EnvAssignments|re: '^DYLD_(INSERT_LIBRARIES|LIBRARY_PATH)='
  condition: selection
falsepositives:
  - Local development of code that itself uses DYLD_INSERT_LIBRARIES (rare; usually scoped to non-managed dev hosts).
  - 'Apple-signed binaries are immune to DYLD_INSERT_LIBRARIES under SIP, but the rule still fires on the launch: investigate why an admin script is setting these vars at all.'
x-engine:
  rule_id: dyld_insert
  type: sigma
  portable: mapped
  portability_note: The rule's logic is the detection block in this file. It is valid Sigma, but it reads at least one field this engine computes from the argument vector rather than one from Sigma's own taxonomy, so another engine needs those fields to evaluate it. The computed fields exist because Sigma represents a command line as a single string, in which argument position is no longer recoverable.
  event_types:
    - exec
  limitations:
    - 'Inherited environment variables (set by a parent shell, not on the exec line) are invisible: ESF does not yet hand the agent the full env map. Tracked as future work.'
    - 'DYLD_FRAMEWORK_PATH and DYLD_FALLBACK_* are intentionally NOT matched: higher-FP, lower-signal. Extend dyldPrefixes if a pilot surfaces real abuse.'
