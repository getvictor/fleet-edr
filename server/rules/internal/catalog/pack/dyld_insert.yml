title: DYLD injection on exec
id: a531f8d1-c355-5aba-99ea-6b3e22697c18
status: stable
description: |-
  Flags an env(1) invocation that sets DYLD_INSERT_LIBRARIES or DYLD_LIBRARY_PATH for the command it runs.

  Detects the classic macOS code-injection primitive: launching a process with `DYLD_INSERT_LIBRARIES=…` or `DYLD_LIBRARY_PATH=…` set so dyld loads attacker-supplied dylibs into the new process before main(). The rule fires on an `env VAR=value /path/to/bin` invocation only, matching the assignments env itself applies rather than any argument containing the text, so substring noise (curl POST data, echo, etc.) does not false-positive.

  The matching dylib path is redacted in alert text (a sensitive payload location) but kept in the raw event payload for responders.
author: Fleet EDR
level: high
tags:
  - attack.t1574.006
logsource:
  product: macos
  category: process_creation
detection:
  # EnvAssignments holds the leading KEY=VALUE window of an `env` invocation, and nothing for any other binary. That is the whole
  # point of the field. `env DYLD_INSERT_LIBRARIES=x /bin/true` and `env /bin/true DYLD_INSERT_LIBRARIES=x` carry the same text and
  # only the first is an injection, and a CommandLine substring match cannot tell them apart because a substring match is precisely
  # what discards position. A shell assignment such as `DYLD_INSERT_LIBRARIES=x /bin/true` is absent from the argument vector
  # entirely, so it is not matched here and cannot be (issue #791).
  #
  # Matched with |re rather than |startswith because |startswith folds case, while the Go rule this replaces used
  # strings.HasPrefix: a lowercased `dyld_insert_libraries=` would otherwise have started firing.
  #
  # No binary condition, deliberately: the rule has never had one. The executable path decides only whether the leading window is
  # argv[0] alone or a run of `env` assignments, and that decision lives in the field rather than here.
  selection:
    EnvAssignments|re: '^DYLD_(INSERT_LIBRARIES|LIBRARY_PATH)='
  condition: selection
falsepositives:
  - Local development of code that itself uses DYLD_INSERT_LIBRARIES (rare; usually scoped to non-managed dev hosts).
  - 'Apple-signed binaries are immune to DYLD_INSERT_LIBRARIES under SIP, but the rule still fires on the launch: investigate why an admin script is setting these vars at all.'
x-engine:
  rule_id: dyld_insert
  type: sigma
  portable: mapped
  portability_note: The rule's logic is the detection block in this file. It is valid Sigma, but it reads the field EnvAssignments, which this engine computes rather than taking from Sigma's own taxonomy, so another engine needs it supplied to evaluate the rule. Sigma has no equivalent because it represents a command line as a single string, in which argument position is no longer recoverable.
  event_types:
    - exec
  limitations:
    - 'Only an `env(1)` invocation is detected. A shell assignment such as `DYLD_INSERT_LIBRARIES=… /bin/ls` is not, and never was despite earlier wording here: a shell applies those variables without passing them as arguments, so the assignment is absent from the event the sensor records (issue #791). Capturing the environment is tracked as issue #862.'
    - 'DYLD_FRAMEWORK_PATH and DYLD_FALLBACK_* are intentionally NOT matched: higher-FP, lower-signal. Add them to the detection block in the rule''s pack file if a pilot surfaces real abuse; the Go prefix list only names the matched variable in the alert.'
