title: Sudoers tamper
id: 21004f8d-258a-5114-a20a-c987446bbf32
status: stable
description: |-
  Flags any non-allowlisted writer that changes /etc/sudoers or /etc/sudoers.d/*.

  Detects an instant escalation primitive: writing to `/etc/sudoers` or any direct child of `/etc/sudoers.d/`. A successful tamper grants future shell sessions arbitrary command execution as root.

  Unlike the persistence rules, this one deliberately does NOT key on Apple-signed platform binaries: the canonical attacker tools for sudoers tampering ARE platform binaries (cp, tee, redirected shells, even `sudo vi /etc/sudoers`), so a platform-binary filter would silence every realistic attack while admitting almost nothing of value. Operators tune with a path-glob exclusion via the detection-config surface instead.

  `visudo` and `sudoedit` use atomic-rename semantics, so the rule does not see them at all. That cuts both ways: it is why legitimate edits are quiet, and it is why an attacker who writes a temp file and renames it onto /etc/sudoers is missed.
author: Fleet EDR
level: high
tags:
  - attack.t1548.003
logsource:
  product: macos
  category: file_event
detection:
  # A sudoers file being changed. The adapter supplies TargetFilename only for an event that carries write access, so this one
  # condition is the whole rule (#801).
  #
  # It used to carry two more tests, WriteIntent and a MutatingOpen-based suppression of sudo's LOCK_EX flock, and both were
  # inert. Since #301 the only source of these events re-emits ESF NOTIFY_CREATE and NOTIFY_WRITE with a CONSTANT synthetic flag
  # set (1537), against which write access is always set and the mutating bits are always set, so the first test always passed
  # and the second could never fire. They could not be made real either: real open(2) flags need broad NOTIFY_OPEN, which
  # ADR-0008 drops because ESF cannot mute it per event type and, in the ADR's own words, it "is not how top EDRs collect file
  # telemetry".
  #
  # Retiring them is what makes this rule plain Sigma. The events it now reads ARE completed creations and modifications, which
  # is what Sigma's file_event category means, so the rule no longer needs a field this engine computes.
  selection:
    TargetFilename|re: '^(?:/private)?/etc/sudoers(?:\.d/[^/]+)?$'
  condition: selection
falsepositives:
  - Configuration-management agents (Ansible, Chef, Puppet, MDM-driven scripts) that drop a sudoers fragment under /etc/sudoers.d. Add a path-glob exclusion for their absolute writer paths.
x-engine:
  rule_id: sudoers_tamper
  type: sigma
  portable: standard
  portability_note: The rule's logic is the detection block in this file and reads only fields from Sigma's own taxonomy, so any Sigma-compatible engine can evaluate it as it stands.
  event_types:
    - open
  exclusions:
    - path_glob
  limitations:
    - 'Atomic-rename writes (write a temp file, rename onto /etc/sudoers) are missed: the extension does not subscribe to ESF NOTIFY_RENAME today, though ADR-0008 decided it should. This is the rule''s largest gap and a trivial evasion.'
    - 'On an agent predating #301, which sends real open(2) flags, sudo taking its LOCK_EX flock on /etc/sudoers now alerts. The suppression for it was retired with the flag fields (#801) because it was inert on every current agent. Add a path-glob exclusion for /usr/bin/sudo if such agents are still in the fleet.'
