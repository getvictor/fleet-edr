title: Sudoers tamper
id: 21004f8d-258a-5114-a20a-c987446bbf32
status: stable
description: |-
  Flags any non-allowlisted writer that changes /etc/sudoers or /etc/sudoers.d/*.

  Detects an instant escalation primitive: writing to `/etc/sudoers` or any direct child of `/etc/sudoers.d/`. A successful tamper grants future shell sessions arbitrary command execution as root.

  Unlike the persistence rules, this one deliberately does NOT key on Apple-signed platform binaries: the canonical attacker tools for sudoers tampering ARE platform binaries (cp, tee, redirected shells, even `sudo vi /etc/sudoers`), so a platform-binary filter would silence every realistic attack while admitting almost nothing of value. Operators tune with a path-glob exclusion via the detection-config surface instead.

  The rule reads renames as well as writes, so an attacker who writes a temp file and renames it onto a sudoers path is caught at the moment the file becomes policy. It matches only the names sudo will actually parse: sudoers(5) skips files in /etc/sudoers.d whose names contain a `.` or end in `~`, and a file sudo skips grants nothing.
author: Fleet EDR
level: high
tags:
  - attack.t1548.003
logsource:
  product: macos
  category: file_event
detection:
  # A sudoers file being changed. The adapter supplies TargetFilename only for an event that carries write access, so this one
  # condition is the whole rule (#801).
  #
  # It used to carry two more tests, WriteIntent and a MutatingOpen-based suppression of sudo's LOCK_EX flock, and both were
  # inert. Since #301 the only source of these events re-emits ESF NOTIFY_CREATE and NOTIFY_WRITE with a CONSTANT synthetic flag
  # set (1537), against which write access is always set and the mutating bits are always set, so the first test always passed
  # and the second could never fire. They could not be made real either: real open(2) flags need broad NOTIFY_OPEN, which
  # ADR-0008 drops because ESF cannot mute it per event type and, in the ADR's own words, it "is not how top EDRs collect file
  # telemetry".
  #
  # Retiring them is what makes this rule plain Sigma. The events it now reads ARE completed creations and modifications, which
  # is what Sigma's file_event category means, so the rule no longer needs a field this engine computes.
  #
  # The pattern matches only the files sudo will actually PARSE. sudoers(5): sudo reads each file in /etc/sudoers.d
  # "skipping file names that end in '~' or contain a '.' character", so `[^/.]*[^/.~]` is that rule written as a regex: no dot
  # anywhere, and not ending in a tilde. Verified on macOS 26.3 with three files of identical content differing only in name:
  # zzdotless loaded, zz.dotted and zztilde~ did not.
  #
  # Narrowing matters because the old `[^/]+` matched names sudo ignores, so the rule raised a Critical escalation alert on a
  # file that grants nothing. That was not theoretical: one `visudo -f /etc/sudoers.d/<name>` writes `<name>.tmp`, a sibling
  # inside the watched prefix, and the rule fired on it every time (#933).
  #
  # For a `file_rename` event TargetFilename is the DESTINATION, so the same condition asks the right question of both event
  # types: an open asks "was a policy file written", a rename asks "did a file just become policy".
  selection:
    TargetFilename|re: '^(?:/private)?/etc/sudoers(?:\.d/[^/.]*[^/.~])?$'
  condition: selection
falsepositives:
  - Configuration-management agents (Ansible, Chef, Puppet, MDM-driven scripts) that drop a sudoers fragment under /etc/sudoers.d. Add a path-glob exclusion for their absolute writer paths.
x-engine:
  rule_id: sudoers_tamper
  type: sigma
  portable: mapped
  portability_note: The rule's logic is the detection block in this file and reads only fields from Sigma's own taxonomy, but it consumes event types spanning more than one Sigma category. Sigma allows one logsource category per rule, so this file declares file_event and another engine would never route file_rename events to it. Evaluating the rule as written therefore covers only part of what it detects here; the full set is in x-engine.event_types.
  event_types:
    - open
    - file_rename
  exclusions:
    - path_glob
  limitations:
    - 'Truncation and deletion are not detected: `: > /etc/sudoers` destroys the policy and emits nothing at all, because open(O_TRUNC) is a different kernel path from the CREATE/WRITE/RENAME this rule reads. Tracked as #934.'
    - A rename whose destination sudo will load fires whoever performed it, so an administrator committing a legitimate visudo edit of a /etc/sudoers.d/ fragment is reported alongside an attacker promoting a file into place. From the endpoint's view the two are the same operation on the same path, and the rule deliberately does not filter on platform-binary status (see the description). Operators tune with a path-glob exclusion on the writer.
    - 'On an agent predating #301, which sends real open(2) flags, a writer that opens a sudoers file write-mode with no content-changing flag and then writes is no longer reported. #801 moved the lock-versus-modification decision into the field supplier, which does not distinguish writers, where the rule''s own suppression named sudo alone. sudo''s own lock is still not an alert, and no agent shipping today can produce either shape.'
