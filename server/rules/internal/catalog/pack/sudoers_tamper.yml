title: Sudoers tamper
id: 21004f8d-258a-5114-a20a-c987446bbf32
status: stable
description: |-
  Flags any non-allowlisted writer that opens /etc/sudoers or /etc/sudoers.d/* in write mode.

  Detects an instant escalation primitive: writing to `/etc/sudoers` or any direct child of `/etc/sudoers.d/`. A successful tamper grants future shell sessions arbitrary command execution as root.

  Unlike the persistence rules, this one deliberately does NOT key on Apple-signed platform binaries: the canonical attacker tools for sudoers tampering ARE platform binaries (cp, tee, redirected shells, even `sudo vi /etc/sudoers`), so a platform-binary filter would silence every realistic attack while admitting almost nothing of value. Operators tune with a path-glob exclusion via the detection-config surface instead.

  `visudo` and `sudoedit` use atomic-rename semantics and never open /etc/sudoers in write mode, so the rule does not see them at all.
author: Fleet EDR
level: high
tags:
  - attack.t1548.003
logsource:
  product: macos
  category: file_event
detection:
  # A sudoers file being written. TargetFilename is supplied only for an open that carries write access (see sigmabind), and
  # WriteIntent states that requirement in the rule rather than leaving it to the adapter, so widening the adapter cannot silently
  # widen this rule.
  selection:
    TargetFilename|re: '^(?:/private)?/etc/sudoers(?:\.d/[^/]+)?$'
    WriteIntent: true
  # sudo itself opens /etc/sudoers write-mode to take a LOCK_EX flock for serialised reads: write by access mode, with no intent to
  # change the contents. Suppress that one pattern, and ONLY for sudo, so any other writer using bare O_WRONLY still fires.
  #
  # This is why a single write-intent boolean cannot express the rule: the second flag test is conditional on who is writing, which
  # is why the two masks are separate fields and why Image is supplied for open events at all.
  #
  # The residual gap this filter opens: a sudo that opens the file with bare O_WRONLY and then writes is suppressed. Scoping the
  # exception to sudo is what keeps it narrow (any other writer using bare O_WRONLY still fires), but sudo itself is not covered.
  # Closing it means correlating on NOTIFY_WRITE / NOTIFY_CLOSE_MODIFIED rather than inferring intent from open(2) flags, which is
  # the same fix the atomic-rename limitation below needs.
  filter_sudo_lock:
    Image|re: '^/usr/bin/sudo$'
    MutatingOpen: false
  condition: selection and not filter_sudo_lock
falsepositives:
  - Configuration-management agents (Ansible, Chef, Puppet, MDM-driven scripts) that drop a sudoers fragment under /etc/sudoers.d. Add a path-glob exclusion for their absolute writer paths.
x-engine:
  rule_id: sudoers_tamper
  type: sigma
  portable: mapped
  portability_note: The rule's logic is the detection block in this file. It is valid Sigma, but it reads the fields MutatingOpen and WriteIntent, which this engine computes rather than taking from Sigma's own taxonomy, so another engine needs them supplied to evaluate the rule. Sigma has no equivalent because it represents a file event as a completed creation or modification rather than an open with flags.
  event_types:
    - open
  exclusions:
    - path_glob
  limitations:
    - 'Atomic-rename writes (write a temp file, rename onto /etc/sudoers) are missed: ESF NOTIFY_OPEN doesn''t fire on rename, and the extension does not subscribe to NOTIFY_RENAME today. Tracked as future work.'
