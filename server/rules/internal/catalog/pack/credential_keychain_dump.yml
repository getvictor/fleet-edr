title: Keychain credential dump
id: 77a66007-aa88-5521-9471-50a20231e8c6
status: stable
description: |-
  Flags exec of /usr/bin/security dump-keychain: the canonical macOS Keychain export command.

  Fires when a process invokes `/usr/bin/security` with the `dump-keychain` subcommand. That command exports Keychain entries (saved passwords, private keys) and is the macOS-native equivalent of credential-dumping tooling on Windows. Admin scripts virtually never invoke it; offensive playbooks do.

  Match shape is exact-path + exact-subcommand to keep the rule high-precision. A shell wrapper (`sh -c "security dump-keychain"`) still surfaces because ESF emits a NOTIFY_EXEC for each execve(), so the security binary always shows up as its own exec event regardless of parent.
author: Fleet EDR
level: high
tags:
  - attack.t1555.001
logsource:
  product: macos
  category: process_creation
detection:
  # The binary whose invocation defines this rule. Changing it does not tune the detection, it makes it a different one.
  #
  # Matched with |re rather than a plain value because a plain Sigma value folds case while the Go rule this replaces compared
  # against an exact set. Without it, /usr/bin/SECURITY would match here and did not before.
  selection_binary:
    Image|re: '^/usr/bin/security$'
  # The subcommands that constitute credential theft rather than ordinary keychain use. Adjacent enumerative subcommands
  # (find-internet-password -w, find-generic-password -w) are deliberately absent for precision; add them here if a fleet
  # surfaces real abuse.
  #
  # Subcommand is a computed field (server/rules/internal/sigmabind/argv.go): the first non-flag token after argv[0]. That is what
  # keeps `security help dump-keychain` from matching, which a CommandLine substring cannot express and which the fixture
  # negative_help_mentions_subcommand exists to hold. |re again for case: `security DUMP-KEYCHAIN` is not a subcommand security
  # acts on.
  selection_subcommand:
    Subcommand|re: '^dump-keychain$'
  condition: selection_binary and selection_subcommand
falsepositives:
  - An IT admin running a one-off keychain audit. Rare in managed fleets; confirm with the user before treating as benign.
x-engine:
  rule_id: credential_keychain_dump
  type: sigma
  portable: mapped
  portability_note: The rule's logic is the detection block in this file. It is valid Sigma, but it reads the field Subcommand, which this engine computes rather than taking from Sigma's own taxonomy, so another engine needs it supplied to evaluate the rule. Sigma has no equivalent because it represents a command line as a single string, in which argument position is no longer recoverable.
  event_types:
    - exec
  limitations:
    - Does not cover Keychain reads via the Security framework (SecItemCopyMatching, etc.) or raw SQLite scrapes of login.keychain-db. Those paths are tracked for a future file-integrity rule.
    - Does not cover adjacent enumerative subcommands (find-internet-password -w, find-generic-password -w); left out for precision; add them to the detection block in the rule's pack file if a pilot fleet surfaces real abuse.
