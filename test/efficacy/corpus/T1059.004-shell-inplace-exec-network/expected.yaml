# Expected detection assertions for the in-place shell exec scenario. Before issue #713 this
# produced NO alert while the fork-shaped equivalent produced one, so a regression here means the
# network arm has stopped consulting the connecting pid's exec chain and zsh payloads are invisible
# again.
scenario_id: T1059.004-shell-inplace-exec-network
mitre: T1059.004 + T1105
within_seconds: 30
rules:
  - rule_id: suspicious_exec
    severity: high
    expect: alert
