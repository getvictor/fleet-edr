# Expected detection assertions for the T1059.002-osascript-network-exec technique scenario.
# rule_id: catalog rule ID that should fire (one row in /api/alerts when
# the L6 runner polls). severity: pinned so a rule downgrade is visible.
# within_seconds: per-rule SLA budget from POST to alert visibility.
scenario_id: T1059.002-osascript-network-exec
# This field names what the SCENARIO performs, which since issue #755 is no longer the same as what the rule CLAIMS. The
# scenario really does fetch a stage-2 over the network; the rule declares no such technique, because it does not observe the transfer,
# only that a downloader ran. Both are correct and
# neither is stale.
mitre: T1059.002 + T1105
within_seconds: 30
rules:
  - rule_id: osascript_network_exec
    severity: critical
    expect: alert
