# Expected detection assertions for the T1562.001-sensor-recovery-failed scenario.
#
# Both rules are asserted because the scenario feeds the full episode and an
# operator sees both: sensor_tamper for the stop, and sensor_recovery_failed for
# the repair giving up. Asserting only the second would let a regression that
# silently stopped reporting the stop pass unnoticed here.
#
# They are recorded in different places, which is what `expect` says. The stop is
# a detection and raises an alert. The exhaustion is a fault in this product's own
# software, so since issue #778 it is a host health episode instead, and the
# harness also fails the scenario if it raised an alert as well: recording the
# episode alongside the old alert would be the move half done.
#
# The budget matches the sibling scenario's, and for the same reason: the stop
# alert is the slow half, because that rule deliberately waits out its recovery
# window before deciding. This rule's own event is terminal and needs no wait.
scenario_id: T1562.001-sensor-recovery-failed
mitre: T1562.001
within_seconds: 45
rules:
  - rule_id: sensor_tamper
    severity: high
    expect: alert
  - rule_id: sensor_recovery_failed
    severity: critical
    expect: health_episode
