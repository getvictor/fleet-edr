# T1547.015 Boot or Logon Autostart Execution: Login Items.
#
# An app registers a helper in its Contents/Library/LoginItems/ with Background Task Management through SMAppService
# (ES_EVENT_TYPE_NOTIFY_BTM_LAUNCH_ITEM_ADD, item_type=login_item). BTM reports no executable for a login item, so the agent
# signs the helper bundle itself. persistence_login_item fires on the unmanaged registration of an ad-hoc helper. Mirrors the
# positive_untrusted_helper fixture, which is the shape captured on edr-dev.
