# ---------------------------------------------------------------------------------------------------------------------------
# Network response capability that 2026-06-22-resilient-network-enforcement specified and the archive dropped, and which was
# never built. Filed as features rather than restored, for the same reason as Detect mode above.
# ---------------------------------------------------------------------------------------------------------------------------

- requirement: extension-network-response/host-network-containment-is-declarative-and-survives-provider-restart
  tracked_by: "#948"
  reason: >-
    Host containment is not implemented. Nothing in the extension persists a containment ruleset or reapplies one on provider
    restart, and the operator-facing half is #584. Restoring the requirement would claim an incident-response action the
    product does not have.

- requirement: extension-network-response/a-blocked-dns-query-is-answered-locally-without-upstream
  tracked_by: "#949"
  reason: >-
    Not implemented: neither NXDOMAIN nor a sinkhole answer is produced anywhere in extension/edr, so a blocked query is not
    answered locally and enforcement still depends on the upstream path it is meant to be independent of.
