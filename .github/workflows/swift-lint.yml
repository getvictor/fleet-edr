name: Swift lint

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".swiftlint.yml"
      - "Taskfile.yml"
      - ".github/workflows/swift-lint.yml"
  pull_request:
    paths:
      - "extension/**"
      - ".swiftlint.yml"
      - "Taskfile.yml"
      - ".github/workflows/swift-lint.yml"
  workflow_dispatch:

# Top-level token has no permissions; each job grants the exact scopes it
# needs (satisfies Scorecard Token-Permissions, Sonar githubactions:S8264,
# zizmor excessive-permissions).
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install SwiftLint
        run: brew install swiftlint

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.50.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run SwiftLint via Taskfile
        run: task lint:swift
