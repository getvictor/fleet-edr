name: OpenSSF Scorecard

on:
  # Run on each push to main so the badge + code-scanning tab stay fresh.
  push:
    branches: [main]
  # Weekly rescan catches new advisories about unchanged code.
  schedule:
    - cron: "43 2 * * 1"
  # Lets us re-run after fixing a finding without pushing an empty commit.
  workflow_dispatch:

# Top-level token has no permissions; each job grants the exact scopes it
# needs (satisfies Scorecard Token-Permissions, Sonar githubactions:S8264,
# zizmor excessive-permissions).
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to the Security tab
      id-token: write # Sigstore-keyless signing when publish_results=true
      contents: read # required by scorecard-action to read the repo
      actions: read # Branch-Protection + Webhooks checks inspect Actions via API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Publishes the scorecard to https://scorecard.dev/. The public
          # registry is how buyers' procurement automation sees the score
          # without auth; leave on for that enterprise-signal.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Scorecard-SARIF
          path: scorecard-results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: scorecard-results.sarif
