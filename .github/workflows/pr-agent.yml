name: PR review (pr-agent)

# Open-source PR review, running as a replacement for the metered hosted bots (issue #1141). The software is MIT and Actions
# minutes are free on this public repository, so the only cost is model tokens: roughly 20k in / 2k out per review against the
# ~41 KB median diff here.
#
# Two deliberate narrowings from the upstream example workflow, both load-bearing:
#
# 1. TRIGGER. Upstream reviews on `synchronize` as well, which is what made the hosted bill scale with pushes rather than PRs
#    (2.35 commits per PR here, so ~2.35x the reviews). This runs once when a PR opens, and again only when a draft is marked
#    ready. Re-review is manual, via a `/review` comment, which is the same shape as `@coderabbitai review`.
#
# 2. SCOPE. Upstream documents `pull_request_target` so that forks can be reviewed. That is deliberately NOT used. This repo is
#    public, anyone can open a pull request, and a reviewing agent reads the diff as instructions (OWASP LLM01, indirect prompt
#    injection). `pull_request_target` would hand a workflow processing attacker-authored text both the model key and a
#    write-capable token. With the plain `pull_request` event a fork PR gets neither secrets nor write access, so the failure
#    mode is a skipped review rather than a compromised one. The `if:` below makes that explicit rather than incidental.
#
#    The `/review` comment trigger reopens that question, because `issue_comment` DOES carry secrets even when the pull request
#    came from a fork. That is why authorization is a separate job that holds no secrets and no environment: it re-resolves the
#    pull request through the API and only then lets the review job start. Gating inside the review job would be too late, since
#    the environment (and therefore the model key) is granted when the job begins, not when its first step passes.
#
# SUPPLY CHAIN CAVEAT: the action is pinned by commit SHA, but upstream's `Dockerfile.github_action_dockerhub` is only
# `FROM pragent/pr-agent:github_action`, a MUTABLE Docker Hub tag. So the pin fixes the wrapper, not the code that executes.
# Accepted here because the job holds no checkout, a scoped token, and one secret. Pinning the image by digest instead would
# mean vendoring the Dockerfile; revisit if this job is ever given more than it has now.

on:
  pull_request:
    types: [opened, ready_for_review]
  # Manual re-review. Round 2b of the review policy re-runs this agent after a round of fixes on a large or sensitive pull
  # request, to check that the fixes did not introduce new defects. `created` only: an edited comment must not re-trigger, or
  # editing an old comment becomes a replay button.
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  # issue_comment carries no pull_request object, so the number comes from the issue instead. Not cancel-in-progress here: a
  # review that is already talking to the model should finish rather than be discarded by a second `/review`.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # Authorization is its own job ON PURPOSE, and it declares no environment and receives no secrets. The review job below cannot
  # start until this one says yes, so the model key is never granted to a run that turns out to be unauthorized. Doing the same
  # check as a first step inside the review job would be strictly weaker: environments are granted at job start.
  authorize:
    name: Authorize
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    # Cheap event-shape filter. It rejects the obvious cases without an API call, but it is NOT the security boundary: the
    # payload of an issue_comment describes the comment, not the pull request, so everything that matters is re-resolved below.
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.user.login == github.repository_owner)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && github.event.comment.user.login == github.repository_owner
        && startsWith(github.event.comment.body, '/review'))
    steps:
      - name: Resolve the pull request and decide
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `github.event.comment.body` is deliberately NOT passed to the shell. It is attacker-influenceable text on a public
          # repository, and the only thing needed from it was already tested in the `if:` above, where an expression cannot be
          # made to execute anything.
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Read the three facts from the API rather than the event payload. For the pull_request path this is belt and braces;
          # for the comment path it is the whole check, because a comment on a fork's pull request looks identical to a comment
          # on a local one until you ask.
          read -r author head_repo is_draft < <(
            gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '"\(.user.login) \(.head.repo.full_name // "deleted") \(.draft)"'
          )
          deny() { echo "::notice::Review skipped: $1"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$author" = "$OWNER" ]      || deny "pull request #$PR_NUMBER is authored by $author, not $OWNER."
          [ "$head_repo" = "$REPO" ]    || deny "pull request #$PR_NUMBER comes from $head_repo, which is not this repository."
          [ "$is_draft" = "false" ]     || deny "pull request #$PR_NUMBER is still a draft."
          echo "ok=true" >> "$GITHUB_OUTPUT"

  review:
    name: Review
    needs: authorize
    if: needs.authorize.outputs.ok == 'true'
    runs-on: ubuntu-latest
    # A dedicated environment, not a bare repository secret. Two reasons: the model key is then scoped to this one job rather
    # than readable by every workflow in the repo, and the environment carries its own branch policy, so the key stays
    # unreachable even if the `if:` above were ever loosened by mistake. zizmor's secrets-outside-env audit requires it.
    environment: pr-agent-review
    permissions:
      # Enough to read the diff and post one review comment. Upstream's example also asks for `contents: write` and
      # `checks: write`; neither is needed, because this job never pushes a commit and never publishes a check run.
      contents: read
      pull-requests: write
    steps:
      # pr-agent exits 0 even when the model call fails. A wrong, missing, or revoked key surfaces only as a WARNING in the step
      # log ("Incorrect API key provided: dummy_key") and the job still reports success, so the review silently stops happening and
      # the green check says otherwise. Bracketing the review with a timestamp and asserting that something was actually posted is
      # what turns that into a failure.
      - name: Note the time before the review
        id: before
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Review the pull request
        uses: the-pr-agent/pr-agent@1d01f24f455bb879c1d9c557ad7de3d72dcc7975 # v0.46.0
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Configuration lives here rather than in `.pr_agent.toml` on purpose. That file is read by the hosted Qodo app, which
          # keeps running in parallel until the comparison in #1141 settles; keeping this job's settings in the workflow means
          # the two reviewers cannot perturb each other, and the baseline stays a baseline.
          #
          # Review only. `describe` is off because the maintainer owns PR bodies (same rule the hosted config states), and
          # `improve` is off because its suggestions duplicate what the other bots already emit.
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          # Model is pinned, not left on upstream's default. `gpt-5.6` is a MOVING ALIAS that currently resolves to gpt-5.6-sol,
          # so the default locks neither a version nor a price. gpt-6-sol is the mid-tier of the newer family and costs half of
          # what gpt-5.6-sol does ($2/$10 per 1M vs $4/$20), which at this repository's ~223 owner-authored PRs a month is about
          # $13/month against $27. It is also the better reviewer for this job despite the lower price: it makes 41-54% fewer
          # errors than gpt-5.6-sol at equal effort and improves on complex real-world software-engineering tasks, even though
          # gpt-5.6-sol still edges it on public coding benchmarks.
          #
          # The fallback is deliberately priced within a rounding error of the primary ($2/$12), so an upstream outage degrades
          # the review rather than the budget.
          #
          # Choosing a non-Claude reviewer is intentional: Claude writes the code here, and a reviewer sharing its blind spots
          # agrees with a bug rather than catching it.
          config.model: "gpt-6-sol"
          config.fallback_models: '["gpt-5.6-terra"]'
          #
          # The hosted config's review guidance lives under keys the open-source schema does not have
          # (`review_agent.issues_user_guidelines`), so it is restated here against the key that does exist.
          pr_reviewer.extra_instructions: |
            This is an EDR (endpoint detection and response) product; security and hot-path performance findings are the priority.
            Prioritize: bypassed or reordered authorization checks, TOCTOU races, blocking calls or network access on Endpoint
            Security callback paths (code-signing evaluation there must pass kSecCSNoNetworkAccess / .noNetworkAccess), unbounded
            CPU or memory in kernel-adjacent handlers, IPC peer-validation gaps (audit_token plus a code-signing requirement on
            every XPC channel), trusting userspace-claimed fields where a kernel-vouched value exists (use audit_token-derived
            PIDs, not es_process_t claims), secrets or PII in log statements, audit-log tampering (audit_events is append-only),
            weak crypto, and SQL injection.
            Performance on ingestion paths (ES event handling, event upload pipeline, MySQL writes on the ingest path) is a
            correctness concern: flag per-event allocations, N+1 queries, and lock contention there.
            This tree is largely AI-generated, so also flag, secondary to the above: a new helper, type, validator, or endpoint
            that re-implements logic already present in the same bounded context or in shared internal/ or api/ packages (name the
            existing symbol to reuse), and defensive branches for states no caller can produce or the type system already rules
            out.
            Do not flag: style or formatting that linters own (golangci-lint, SwiftLint, Prettier, dash-lint); Go 1.27 language
            and stdlib features (integer range expressions, strings.SplitSeq, stdlib uuid) as compile errors; the words "fleet"
            and "fleets" in docs/fleet-deployment.md; long Markdown lines, because prose here is never hard-wrapped.
            Files under openspec/ use literal tool-parsed markers ("## ADDED Requirements", "### Requirement:",
            "#### Scenario:") that are exempt from heading-style rules. A behavior change is specified by a delta under
            openspec/changes/<name>/specs/**; the canonical openspec/specs/** tree changes only when `openspec archive` runs at
            release, so never ask a PR to edit openspec/specs/** directly.

      - name: Fail if no review was posted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Interpolated into the environment, never into the script body: a PR number is harmless, but keeping every dynamic
          # value out of `run:` is what stops a future edit from introducing template injection.
          # Same fallback as the authorize job: an issue_comment payload carries no pull_request object.
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          SINCE: ${{ steps.before.outputs.at }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # pr-agent publishes as github-actions[bot], on either surface depending on the tool and the settings in play, so both
          # are counted. `--jq` filters server-side on the timestamp taken before the review ran, which is what keeps an older
          # review on the same PR from vouching for this run.
          comments=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\") | select(.created_at >= \"$SINCE\")] | length")
          reviews=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\") | select(.submitted_at >= \"$SINCE\")] | length")
          total=$(( comments + reviews ))
          if [ "$total" -eq 0 ]; then
            echo "::error::pr-agent posted no review (checked comments and reviews since $SINCE)." \
                 "The step above exits 0 even when the model call fails, so read its log:" \
                 "an authentication error naming 'dummy_key' means OPENAI_KEY is missing from the pr-agent-review environment" \
                 "or is no longer valid."
            exit 1
          fi
          echo "pr-agent posted $total item(s) since $SINCE."
