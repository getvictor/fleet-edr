name: Markdown lint

# See go-lint.yml for the gate-then-analyze pattern rationale.
#
# Two gates, scoped not to overlap:
#   - markdownlint (.markdownlint-cli2.yaml) owns structure: MD040 (untagged
#     fenced code blocks), MD031/MD032/MD022/MD009/MD012 (whitespace hygiene),
#     MD041 (first-line heading).
#   - Prettier (.prettierrc.yaml, proseWrap: never) owns prose wrapping + table
#     column alignment, matching the repo's no-hard-wrap convention.
#
# A third job, doc-issues, checks public docs reference only OPEN GitHub issues
# (tools/doc-issue-lint). It is not path-gated and also runs daily: closing an
# issue can turn a doc no PR touched into a finding.

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.yaml"
      - ".prettierrc.yaml"
      - ".prettierignore"
      - "Taskfile.yml"
      - ".github/workflows/md-lint.yml"
      - "docs/api/openapi.yaml"
      - "docs/attack-navigator-layer.json"
      - "server/rules/internal/catalog/pack/*.yml"
      - "tools/doc-issue-lint/**"
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect markdown changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          PATTERN='\.md$|^\.markdownlint-cli2\.yaml$|^\.prettierrc\.yaml$|^\.prettierignore$|^Taskfile\.yml$|^\.github/workflows/md-lint\.yml$'
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Triggered by $EVENT_NAME; running unconditionally."
            exit 0
          fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if echo "$files" | grep -qE "$PATTERN"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Relevant changes:"
            echo "$files" | grep -E "$PATTERN"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No relevant changes; skipping md-lint."
          fi

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.50.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint markdown structure via Taskfile
        run: task lint:md

      - name: Check markdown prose wrap + table style via Taskfile
        run: task lint:md:prose

  doc-issues:
    name: Public docs reference only open issues
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check issue references in public docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git ls-files -z | go run ./tools/doc-issue-lint
